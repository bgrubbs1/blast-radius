# Gate a pull request on downstream impact.
#
# Any migration file touched by the PR is analysed against DataHub. If a
# downstream asset provably breaks, blast-radius exits 2 and the job fails --
# with the impact report attached as an artifact so the reviewer sees why.
name: schema-guard

on:
  pull_request:
    paths:
      - "migrations/**/*.sql"
      - "models/**/*.sql"

permissions:
  contents: read
  issues: write

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5 # provides uvx for the DataHub MCP server

      - name: Install blast-radius
        run: pip install .

      - name: Find changed migrations and models
        id: changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            -- 'migrations/**/*.sql' 'models/**/*.sql' > changed-files.txt
          if [ -s changed-files.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no migration or model change in this PR"
          fi

      - name: Analyse every blast radius
        if: steps.changed.outputs.any == 'true'
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
        run: |
          status=0
          index=0
          while IFS= read -r file; do
            index=$((index + 1))
            change="$file"
            if [[ "$file" == models/* ]]; then
              change="$RUNNER_TEMP/blast-radius-$index.diff"
              git diff "origin/${{ github.base_ref }}...HEAD" -- "$file" > "$change"
            elif [ ! -f "$file" ]; then
              echo "skipping deleted migration: $file"
              continue
            fi

            set +e
            blast-radius plan \
              --change "$change" \
              --depth 3 \
              --out "out/$index" \
              --fail-on breaking
            code=$?
            set -e

            if [ "$code" -eq 1 ]; then
              exit 1
            fi
            if [ "$code" -eq 2 ]; then
              status=2
            fi
          done < changed-files.txt
          exit "$status"

      - name: Upload the impact report
        if: always() && steps.changed.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-report
          path: out/

      - name: Comment the reports on the PR
        if: failure() && steps.changed.outputs.any == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reports = [];
            function walk(directory) {
              if (!fs.existsSync(directory)) return;
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                const candidate = path.join(directory, entry.name);
                if (entry.isDirectory()) walk(candidate);
                if (entry.isFile() && entry.name === 'impact-report.md') reports.push(candidate);
              }
            }
            walk('out');
            if (!reports.length) return;
            const body = reports
              .sort()
              .map(report => fs.readFileSync(report, 'utf8'))
              .join('\n\n---\n\n')
              .slice(0, 65000);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

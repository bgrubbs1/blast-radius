# Public-repository demonstration of the schema guard.
#
# This workflow deliberately uses only the bundled synthetic fixtures. Never
# add work DataHub credentials to a pull_request workflow: the checked-out code
# and generated reports are visible to repository contributors and readers.
name: schema-guard

on:
  pull_request:
    paths:
      - "migrations/**/*.sql"
      - "models/**/*.sql"

permissions:
  contents: read

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install blast-radius
        run: pip install .

      - name: Find changed migrations and models
        id: changed
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            -- 'migrations/**/*.sql' 'models/**/*.sql' > changed-files.txt
          if [ -s changed-files.txt ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "no migration or model change in this PR"
          fi

      - name: Analyse every blast radius
        if: steps.changed.outputs.any == 'true'
        run: |
          status=0
          index=0
          while IFS= read -r file; do
            index=$((index + 1))
            change="$file"
            if [[ "$file" == models/* ]]; then
              change="$RUNNER_TEMP/blast-radius-$index.diff"
              git diff "origin/${{ github.base_ref }}...HEAD" -- "$file" > "$change"
            elif [ ! -f "$file" ]; then
              echo "skipping deleted migration: $file"
              continue
            fi

            set +e
            blast-radius plan \
              --change "$change" \
              --offline \
              --fixtures fixtures \
              --depth 3 \
              --out "out/$index" \
              --fail-on breaking
            code=$?
            set -e

            if [ "$code" -eq 1 ]; then
              exit 1
            fi
            if [ "$code" -eq 2 ]; then
              status=2
            fi
          done < changed-files.txt
          exit "$status"

      - name: Upload the impact report
        if: always() && steps.changed.outputs.any == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blast-radius-synthetic-report
          path: out/
          retention-days: 1

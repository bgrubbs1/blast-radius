[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blast-radius"
version = "0.1.0"
description = "Agent that computes the blast radius of a schema change from DataHub metadata and writes the migration for you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bradley Grubbs" }]
keywords = ["datahub", "metadata", "lineage", "mcp", "schema-migration", "agent"]
dependencies = [
    "mcp>=1.9",
    "sqlglot>=25",
    "rich>=13",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
blast-radius = "blastradius.cli:main"

[tool.setuptools.packages.find]
include = ["blastradius*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
